<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>魔法映画検定</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Shippori+Mincho:wght@400;600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: one candlelit desk — a parchment card floats over a night study; everything else stays in shadow. */
:root{
  color-scheme: dark;
  --night:#0d1020;        /* page ground: ink-blue night */
  --night-2:#161a30;      /* raised panels */
  --parchment:#efe3c6;    /* question card */
  --parchment-edge:#d6c294;
  --ink:#2a1d10;          /* text on parchment */
  --gold:#e0b44f;         /* accent: candle gold */
  --gold-soft:rgba(224,180,79,.18);
  --ember:#c8553d;        /* wrong answer */
  --moss:#4f8a5b;         /* right answer */
  --mist:#b8bdd6;         /* muted text on night */
  --text:#f3ecd9;         /* text on night */
  --f-display:"IM Fell English SC","Shippori Mincho",serif;
  --f-body:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:var(--text);font-family:var(--f-body);padding-inline:16px;padding-block:0;overflow-x:hidden}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0}
#burst{position:fixed;inset:0;pointer-events:none;z-index:5}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding-block:28px 48px;display:flex;flex-direction:column;gap:22px}
button{font:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* ── title screen ── */
.hero{position:relative;border-radius:6px;overflow:hidden;border:1px solid var(--gold-soft);background:var(--night-2);aspect-ratio:16/9;max-width:100%}
.hero video{transition:opacity .9s ease}
.hero video.fade{opacity:0}
.hero video,.hero .fallback{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .fallback{background:radial-gradient(ellipse at 50% 70%,rgba(224,180,79,.35),transparent 60%),radial-gradient(ellipse at 50% 120%,#2b2140,var(--night))}
.hero .veil{position:absolute;inset:0;background:linear-gradient(to top,rgba(13,16,32,.92) 8%,rgba(13,16,32,.15) 60%,rgba(13,16,32,.35))}
.hero .copy{position:absolute;left:0;right:0;bottom:0;padding:22px 24px;display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--f-ui);font-size:12px;letter-spacing:.24em;color:var(--gold);text-transform:uppercase}
h1{font-family:var(--f-body);font-weight:800;font-size:clamp(28px,6vw,46px);line-height:1.15;margin:0;text-wrap:balance;text-shadow:0 2px 18px rgba(0,0,0,.6)}
h1 .latin{display:block;font-family:var(--f-display);font-weight:400;font-size:.48em;letter-spacing:.08em;color:var(--gold);margin-bottom:4px}
.lede{margin:0;color:var(--mist);font-size:15px;line-height:1.8}

.panel{background:var(--night-2);border:1px solid var(--gold-soft);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:8px}
.field-label{font-family:var(--f-ui);font-size:12px;letter-spacing:.14em;color:var(--mist)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--f-ui);font-size:14px;padding:8px 14px;border-radius:999px;border:1px solid var(--gold-soft);background:transparent;color:var(--text);transition:background .2s,border-color .2s}
.chip:hover{border-color:var(--gold)}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--night);font-weight:700}
.pool{font-family:var(--f-ui);font-size:13px;color:var(--mist);font-variant-numeric:tabular-nums}
.primary{font-family:var(--f-body);font-weight:800;font-size:18px;letter-spacing:.1em;padding:14px 22px;border:none;border-radius:4px;background:linear-gradient(180deg,#f0c865,var(--gold));color:#1d1406;box-shadow:0 0 0 1px rgba(0,0,0,.2),0 6px 24px rgba(224,180,79,.28);transition:transform .15s,box-shadow .2s}
.primary:hover{transform:translateY(-1px);box-shadow:0 0 0 1px rgba(0,0,0,.2),0 8px 32px rgba(224,180,79,.45)}
.primary:disabled{opacity:.4;cursor:not-allowed;transform:none}
.ghost{font-family:var(--f-ui);font-size:14px;padding:10px 16px;border-radius:4px;border:1px solid var(--gold-soft);background:transparent;color:var(--text)}
.ghost:hover{border-color:var(--gold)}
.note{font-family:var(--f-ui);font-size:12px;color:var(--mist);line-height:1.7;margin:0}

/* ── quiz screen ── */
.status{display:flex;align-items:center;gap:14px;font-family:var(--f-ui);font-size:13px;color:var(--mist);font-variant-numeric:tabular-nums}
.bar{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);box-shadow:0 0 12px var(--gold);transition:width .4s}
.score{color:var(--gold);font-weight:700}
.streak{min-width:4.5em;text-align:right}

.card{position:relative;background:var(--parchment);color:var(--ink);border-radius:3px;padding:26px 24px 22px;
  box-shadow:0 0 0 1px var(--parchment-edge) inset,0 0 60px rgba(120,80,20,.25) inset,0 20px 60px rgba(0,0,0,.55),0 0 80px rgba(224,180,79,.08);
  background-image:radial-gradient(ellipse at 20% 10%,rgba(255,255,255,.35),transparent 50%),radial-gradient(ellipse at 90% 100%,rgba(140,100,40,.18),transparent 55%);
  display:flex;flex-direction:column;gap:18px;animation:unfurl .55s cubic-bezier(.2,.8,.2,1)}
@keyframes unfurl{from{opacity:.0;transform:translateY(14px) scale(.985);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
.card.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-family:var(--f-ui);font-size:12px;color:#6d5634}
.tag{border:1px solid rgba(80,55,20,.35);padding:2px 8px;border-radius:2px}
.stars{letter-spacing:.15em;color:#a67a1c}
.qnum{margin-left:auto;font-family:var(--f-display);font-size:15px;color:#6d5634}
.question{font-size:clamp(19px,3.6vw,23px);font-weight:600;line-height:1.65;margin:0;text-wrap:pretty}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:540px){.options{grid-template-columns:1fr}}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:13px 14px;border-radius:3px;border:1px solid rgba(80,55,20,.3);background:rgba(255,250,235,.55);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;transition:background .15s,border-color .15s,transform .15s;min-width:0}
.opt:hover:not(:disabled){background:#fff8e4;border-color:#8a6420;transform:translateY(-1px)}
.opt .k{flex:none;font-family:var(--f-display);font-size:14px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(80,55,20,.45);color:#6d5634}
.opt.right{background:#dcebd5;border-color:var(--moss);box-shadow:0 0 0 2px var(--moss) inset}
.opt.right .k{background:var(--moss);border-color:var(--moss);color:#fff}
.opt.wrong{background:#f1d3c8;border-color:var(--ember)}
.opt.wrong .k{background:var(--ember);border-color:var(--ember);color:#fff}
.opt:disabled{cursor:default}
.opt.dim{opacity:.55}
.reveal{display:flex;flex-direction:column;gap:12px;border-top:1px dashed rgba(80,55,20,.35);padding-top:14px}
.verdict{font-weight:800;font-size:18px;margin:0}
.verdict.ok{color:#2f6b3c}.verdict.ng{color:#a23a24}
.explain{margin:0;line-height:1.85;font-size:15px}
.next{align-self:flex-end}
.hint-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.keys{font-family:var(--f-ui);font-size:12px;color:#8a7350}
.quit{align-self:center}

/* ── result screen ── */
.result{text-align:center;align-items:center}
.big{font-family:var(--f-display);font-size:clamp(56px,14vw,96px);line-height:1;color:var(--gold);text-shadow:0 0 30px rgba(224,180,79,.5);font-variant-numeric:tabular-nums}
.big small{font-size:.35em;color:var(--mist)}
.rank{font-size:26px;font-weight:800;margin:0}
.rank-note{margin:0;color:var(--mist);line-height:1.8;max-width:34em}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.review{text-align:left;width:100%;display:flex;flex-direction:column;gap:10px}
.review h2{font-size:16px;font-family:var(--f-ui);letter-spacing:.12em;color:var(--mist);font-weight:400;margin:6px 0 0}
.miss{background:rgba(239,227,198,.06);border:1px solid var(--gold-soft);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;line-height:1.7;font-size:14px}
.miss b{color:var(--gold)}
.miss .yours{color:#e09a88}

/* ── team mode ── */
.team-only{display:flex;flex-direction:column;gap:16px}
.team-rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.team-row{display:flex;align-items:center;gap:8px;min-width:0;border:1px solid var(--gold-soft);border-radius:4px;padding:6px 10px;background:rgba(255,255,255,.02)}
.team-row .dot{flex:none;width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.team-row input{flex:1;min-width:0;background:transparent;border:none;color:var(--text);font-family:var(--f-body);font-size:15px;padding:6px 0}
.team-row input:focus-visible{outline:none;border-bottom:1px solid var(--gold)}
body.tv .wrap{max-width:1180px}
body.tv .question{font-size:clamp(22px,3vw,34px)}
body.tv .opt{font-size:clamp(17px,1.8vw,22px);padding:16px 18px}
.board{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:14px}
.jar{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;padding:8px 8px 10px;border-radius:8px;border:1px solid transparent;transition:border-color .3s,background .3s,transform .3s}
.jar.turn{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent);transform:translateY(-2px)}
.jar .name{font-family:var(--f-body);font-weight:800;font-size:clamp(14px,1.6vw,19px);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.jar .name::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:7px;vertical-align:middle;box-shadow:0 0 8px var(--c)}
.glass{position:relative;width:min(84px,70%);height:clamp(56px,9vh,110px);border-radius:12px 12px 22px 22px;border:2px solid rgba(220,225,245,.28);border-top-width:4px;background:linear-gradient(90deg,rgba(255,255,255,.07),rgba(255,255,255,.01) 40%,rgba(255,255,255,.06));overflow:hidden;box-shadow:inset 0 -10px 20px rgba(0,0,0,.35)}
.glass .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(to top,color-mix(in srgb,var(--c) 85%,#000),color-mix(in srgb,var(--c) 70%,#fff));box-shadow:0 0 22px var(--c);transition:height .9s cubic-bezier(.3,1.3,.5,1)}
.glass .fill::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 20% 30%,rgba(255,255,255,.55) 0 2px,transparent 3px),radial-gradient(circle at 70% 60%,rgba(255,255,255,.45) 0 1.5px,transparent 2.5px),radial-gradient(circle at 45% 85%,rgba(255,255,255,.5) 0 2px,transparent 3px);background-size:22px 22px,18px 18px,26px 26px;opacity:.8}
.glass .fill::after{content:"";position:absolute;left:0;right:0;top:-3px;height:6px;background:color-mix(in srgb,var(--c) 40%,#fff);filter:blur(2px);opacity:.8}
.jar .pts{font-family:var(--f-display);font-size:clamp(24px,2.8vw,36px);line-height:1;color:var(--text);font-variant-numeric:tabular-nums}
.jar .pts small{font-family:var(--f-ui);font-size:12px;color:var(--mist);margin-left:3px}
.jar .pts.bump{animation:bump .5s cubic-bezier(.3,1.8,.5,1)}
.turnbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--f-ui);font-size:14px;color:#6d5634}
.turnbar .who{display:inline-flex;align-items:center;gap:8px;padding:5px 14px;border-radius:999px;background:var(--c);color:#fff;font-family:var(--f-body);font-weight:800;font-size:clamp(15px,1.7vw,19px);box-shadow:0 2px 10px color-mix(in srgb,var(--c) 50%,transparent);text-shadow:0 1px 2px rgba(0,0,0,.35)}
.turnbar .steal-tag{font-weight:700;color:#a23a24;letter-spacing:.08em}
.opt.out{text-decoration:line-through;text-decoration-color:var(--ember)}
.host{display:flex;flex-direction:column;gap:12px;border-top:1px dashed rgba(80,55,20,.35);padding-top:14px}
.host-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.judge{font-family:var(--f-body);font-weight:800;font-size:clamp(17px,1.8vw,21px);padding:12px 22px;border-radius:4px;border:none;color:#fff;min-width:9em}
.judge.ok{background:linear-gradient(180deg,#5d9d69,#3f7a4b)}
.judge.ng{background:linear-gradient(180deg,#cf6a52,#a8452f)}
.judge:hover{filter:brightness(1.08)}
.plain{font-family:var(--f-ui);font-size:13px;padding:10px 14px;border-radius:4px;border:1px solid rgba(80,55,20,.35);background:rgba(255,250,235,.6);color:var(--ink)}
.plain:hover{border-color:#8a6420}
.peek{margin-left:auto;user-select:none;-webkit-user-select:none;touch-action:none}
.peek-text{font-family:var(--f-ui);font-size:13px;color:#6d5634;min-height:1.2em}
.steal{display:flex;flex-direction:column;gap:10px;border:1px solid rgba(162,58,36,.35);background:rgba(200,85,61,.07);border-radius:4px;padding:12px 14px}
.steal p{margin:0;font-weight:800;color:#a23a24}
.team-btn{font-family:var(--f-body);font-weight:800;font-size:16px;padding:10px 18px;border-radius:999px;border:none;background:var(--c);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.team-btn:hover{filter:brightness(1.1)}
.answer-big{margin:0;font-size:clamp(22px,2.6vw,30px);font-weight:800;color:#2f6b3c}
.answer-big small{display:block;font-family:var(--f-ui);font-size:12px;font-weight:400;color:#6d5634;letter-spacing:.12em;margin-bottom:2px}
.got{font-family:var(--f-ui);font-size:14px;color:#6d5634}
.got b{color:var(--c)}
.result-board{width:100%}
.result-board .glass{height:clamp(90px,16vh,160px)}
body.tv #s-quiz{gap:14px!important}
body.tv .wrap{padding-block:16px 32px}
.winner{font-size:clamp(28px,5vw,44px);font-weight:800;margin:0;color:var(--c,var(--gold));text-shadow:0 0 24px color-mix(in srgb,var(--c,var(--gold)) 55%,transparent);text-wrap:balance}
.standings{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;width:100%;max-width:420px}
.standings li{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:4px;background:rgba(255,255,255,.04);font-variant-numeric:tabular-nums}
.standings .rk{font-family:var(--f-display);color:var(--mist);width:2.2em}
.standings .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.standings .nm::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:8px}
.standings .sc{font-family:var(--f-display);font-size:20px;color:var(--gold)}

/* ── answer effects ── */
#flash{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0}
#flash.gold{animation:flashGold .7s ease-out}
#flash.curse{animation:flashCurse .9s ease-out}
@keyframes flashGold{0%{opacity:0;background:radial-gradient(circle at var(--fx,50%) var(--fy,50%),rgba(255,226,140,.55),rgba(255,200,90,.12) 35%,transparent 65%)}15%{opacity:1}100%{opacity:0;background:radial-gradient(circle at var(--fx,50%) var(--fy,50%),rgba(255,226,140,.55),rgba(255,200,90,.12) 35%,transparent 65%)}}
@keyframes flashCurse{0%{opacity:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(70,20,60,.75) 100%)}20%{opacity:1}100%{opacity:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(70,20,60,.75) 100%)}}
.card.glow{animation:glow 1.1s ease-out}
@keyframes glow{0%{box-shadow:0 0 0 1px var(--parchment-edge) inset,0 0 0 0 rgba(255,214,120,.0),0 20px 60px rgba(0,0,0,.55)}25%{box-shadow:0 0 0 2px #f5d27a inset,0 0 70px 18px rgba(255,214,120,.55),0 20px 60px rgba(0,0,0,.55)}100%{box-shadow:0 0 0 1px var(--parchment-edge) inset,0 0 80px rgba(224,180,79,.08),0 20px 60px rgba(0,0,0,.55)}}
.card.curse{animation:shake .45s,curse 1s ease-out}
@keyframes curse{0%{filter:none}20%{filter:saturate(.3) brightness(.78) hue-rotate(-10deg)}100%{filter:none}}
.opt{position:relative;overflow:hidden}
.opt.right::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.75) 48%,transparent 66%);transform:translateX(-120%);animation:sweep .9s .1s ease-out forwards}
@keyframes sweep{to{transform:translateX(120%)}}
.opt.right{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.045)}100%{transform:scale(1)}}
.opt.wrong{animation:fizzle .5s ease-out}
@keyframes fizzle{0%{filter:none}30%{filter:blur(1.2px) brightness(.85)}100%{filter:none}}
.score.bump{animation:bump .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{40%{transform:scale(1.5);text-shadow:0 0 14px var(--gold)}}
.seal{position:absolute;top:-18px;right:-12px;width:78px;height:78px;border-radius:50%;display:grid;place-items:center;pointer-events:none;font-family:var(--f-body);font-weight:800;font-size:26px;letter-spacing:.02em;z-index:2;animation:stamp .5s cubic-bezier(.2,1.5,.5,1) both}
.seal.ok{background:radial-gradient(circle at 35% 30%,#d24a3a,#8e1f17 70%);color:#f7d9a6;box-shadow:0 4px 0 #6d1510,0 8px 18px rgba(0,0,0,.45),0 0 0 5px rgba(142,31,23,.35);transform:rotate(-12deg)}
.seal.ng{background:radial-gradient(circle at 40% 35%,rgba(40,30,50,.9),rgba(20,15,30,.95) 70%);color:#c9c2d6;box-shadow:0 0 0 6px rgba(30,20,40,.25),0 6px 16px rgba(0,0,0,.4);transform:rotate(8deg);font-size:30px}
@keyframes stamp{0%{opacity:0;transform:scale(2.4) rotate(-30deg)}60%{opacity:1;transform:scale(.92) rotate(-10deg)}100%{opacity:1}}
.combo{position:fixed;left:50%;top:38%;z-index:6;pointer-events:none;transform:translate(-50%,-50%);text-align:center;font-family:var(--f-body);font-weight:800;white-space:nowrap;padding:28px 56px;background:radial-gradient(ellipse at center,rgba(13,16,32,.85) 30%,rgba(13,16,32,0) 72%);animation:combo 1.6s ease-out forwards}
.combo b{display:block;font-size:clamp(34px,9vw,64px);line-height:1.1;background:linear-gradient(100deg,#b8862b 10%,#fff3c4 45%,#e0b44f 60%,#b8862b 90%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 1.2s linear;filter:drop-shadow(0 0 18px rgba(224,180,79,.65))}
.combo span{display:block;font-family:var(--f-display);font-size:15px;letter-spacing:.3em;color:var(--gold);margin-top:6px}
@keyframes combo{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}25%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-75%) scale(1)}}
@keyframes shine{from{background-position:120% 0}to{background-position:-20% 0}}
.sound{font-family:var(--f-ui);font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--gold-soft);background:transparent;color:var(--mist)}
.sound[aria-pressed="true"]{color:var(--gold);border-color:var(--gold)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<canvas id="burst" aria-hidden="true"></canvas>
<div id="flash" aria-hidden="true"></div>

<main class="wrap">
  <!-- TITLE -->
  <section id="s-title" style="display:contents">
    <div class="hero">
      <div class="fallback"></div>
      <video src="assets/opening.mp4" autoplay muted loop playsinline preload="auto"></video>
      <div class="veil"></div>
      <div class="copy">
        <h1><span class="latin">The Wizarding Examination</span>魔法映画検定</h1>
      </div>
    </div>

<script>
(() => {
const $ = s => document.querySelector(s);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const LV_LABEL = ["", "初級", "中級", "上級"];
const STARS = ["", "★", "★★", "★★★"];

/* ── settings ── */
const TEAM_PRESETS = [
  {name:"暁の塔", color:"#d4573c"},
  {name:"深森の塔", color:"#3f9a5c"},
  {name:"月光の塔", color:"#4f86d6"},
  {name:"宵闇の塔", color:"#9a68d4"}
];
const state = { films: new Set([0,1,2,3,4,5,6,7,8]), levels: new Set([1,2,3]), count: 10,
  mode: "solo", teamCount: 2, teamNames: TEAM_PRESETS.map(t => t.name), format: "choice", steal: true };
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const filmChips = [{id:"all",label:"全作品"}].concat(FILMS.map((n,i)=> i? {id:i,label:n} : null).filter(Boolean)).concat([{id:0,label:"シリーズ横断"}]);

function chip(label, pressed, onClick){
  const b = document.createElement('button');
  b.className = 'chip'; b.textContent = label; b.setAttribute('aria-pressed', pressed);
  b.addEventListener('click', onClick); return b;
}
function renderTeamRows(){
  const box = $('#team-rows'); box.innerHTML = '';
  for (let i=0;i<state.teamCount;i++){
    const row = document.createElement('label'); row.className='team-row'; row.style.setProperty('--c', TEAM_PRESETS[i].color);
    row.innerHTML = `<span class="dot"></span><input id="team-name-${i}" maxlength="12" aria-label="チーム${i+1}の名前">`;
    const inp = row.querySelector('input'); inp.value = state.teamNames[i];
    inp.addEventListener('input', () => { state.teamNames[i] = inp.value; });
    inp.addEventListener('blur', () => { if (!inp.value.trim()){ state.teamNames[i] = TEAM_PRESETS[i].name; inp.value = state.teamNames[i]; } });
    box.appendChild(row);
  }
}
function renderSettings(){
  const md = $('#modes'); md.innerHTML = '';
  [["solo","ひとりで"],["team","チーム対抗（テレビ・プロジェクター向け）"]].forEach(([v,l]) => md.appendChild(chip(l, state.mode===v, () => {
    state.mode = v; if (v==="team" && state.count===10) state.count = 20; renderSettings();
  })));
  const team = state.mode === "team";
  $('#team-settings').hidden = !team;
  if (team){
    const tc = $('#team-count'); tc.innerHTML = '';
    [2,3,4].forEach(v => tc.appendChild(chip(v+"チーム", state.teamCount===v, () => { state.teamCount=v; renderTeamRows(); renderSettings(); })));
    if ($('#team-rows').children.length !== state.teamCount) renderTeamRows();
    const fm = $('#formats'); fm.innerHTML = '';
    [["choice","4択（選択肢あり）"],["oral","口頭回答（選択肢なし）"]].forEach(([v,l]) => fm.appendChild(chip(l, state.format===v, () => { state.format=v; renderSettings(); })));
    const st = $('#steals'); st.innerHTML = '';
    [[true,"あり"],[false,"なし"]].forEach(([v,l]) => st.appendChild(chip(l, state.steal===v, () => { state.steal=v; renderSettings(); })));
    $('#team-help').textContent =
      (state.format==="choice"

    bx.globalAlpha=Math.max(p.life,0);
    if (p.type==='star'){ bx.fillStyle=p.c; bx.save(); bx.translate(p.x,p.y); bx.rotate(p.rot+=.1); bx.fillRect(-p.r,-p.r/4,p.r*2,p.r/2); bx.fillRect(-p.r/4,-p.r,p.r/2,p.r*2); bx.restore(); }
    else if (p.type==='ring'){ p.r+=p.grow; p.grow*=.97; bx.strokeStyle=p.c+Math.max(p.life,0)*.9+')'; bx.lineWidth=2.5*p.life+.5; bx.beginPath(); bx.arc(p.x,p.y,p.r,0,6.28); bx.stroke(); }
    else if (p.type==='seek'){ if(p.delay>0){p.delay--;} else { const dx=p.tx-p.x, dy=p.ty-p.y, d=Math.hypot(dx,dy)||1; p.vx=p.vx*.88+dx/d*1.6; p.vy=p.vy*.88+dy/d*1.6; if(d<14) p.life=0; }
      const g=bx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4); g.addColorStop(0,p.c); g.addColorStop(1,'rgba(255,200,90,0)'); bx.fillStyle=g; bx.beginPath(); bx.arc(p.x,p.y,p.r*4,0,6.28); bx.fill(); }
    else if (p.type==='drop'){ bx.fillStyle=p.c; bx.beginPath(); bx.arc(p.x,p.y,p.r,0,6.28); bx.fill(); }
    else { const g=bx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r); g.addColorStop(0,p.c); g.addColorStop(1,'rgba(0,0,0,0)'); bx.fillStyle=g; bx.beginPath(); bx.arc(p.x,p.y,p.r,0,6.28); bx.fill(); p.r*=1.02; }
  });
  bx.globalAlpha=1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
function origin(el){ const r=el.getBoundingClientRect(); return [r.left+r.width/2, r.top+r.height/2]; }
function sparkle(el, power=1){
  if (reduce) return; const [x,y]=origin(el);
  const cols=['#fff4c9','#f5d27a','#e0b44f','#ffffff','#ffd98a'];
  for(let i=0;i<60*power;i++){ const a=Math.random()*6.28, sp=Math.random()*6*power+1.5;
    parts.push({type:'star',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,g:.09,r:Math.random()*3+1.5,rot:Math.random()*6,c:pick(cols),life:1,decay:Math.random()*.012+.012}); }
}
function smoke(el){
  if (reduce) return; const [x,y]=origin(el);
  for(let i=0;i<26;i++){ parts.push({type:'puff',x:x+(Math.random()-.5)*60,y:y+(Math.random()-.5)*20,vx:(Math.random()-.5)*.8,vy:-Math.random()*1.2-.3,g:-.005,r:Math.random()*10+8,c:'rgba(120,110,130,.55)',life:.9,decay:.014}); }
}

/* ── answer effects ── */
const flash = $('#flash');
function flashAt(kind, el){
  if (reduce) return;
  if (el){ const [x,y]=origin(el); flash.style.setProperty('--fx', x+'px'); flash.style.setProperty('--fy', y+'px'); }
  flash.className=''; void flash.offsetWidth; flash.className=kind;
}
function ring(el, color, n=2){
  if (reduce) return; const [x,y]=origin(el);
  for(let i=0;i<n;i++) parts.push({type:'ring',x,y,vx:0,vy:0,g:0,r:10+i*14,grow:5.5-i*1.2,c:color,life:1,decay:.028});
}
function toScore(el, n=14, target, color='#ffe6a0'){
  if (reduce) return; const [x,y]=origin(el); const [tx,ty]=origin(target || $('#score'));
  for(let i=0;i<n;i++) parts.push({type:'seek',x:x+(Math.random()-.5)*80,y:y+(Math.random()-.5)*30,vx:(Math.random()-.5)*6,vy:-Math.random()*5-1,g:0,tx,ty,r:Math.random()*2+1.6,c:color,life:1,decay:.006,delay:i*2});
}
function rain(color){
  if (reduce) return;
  const cols = color ? [color, lighten(color), '#fff4c9', '#ffffff'] : ['#fff4c9','#f5d27a','#e0b44f','#ffd98a','#ffffff'];
  for(let i=0;i<120;i++) parts.push({type:'star',x:Math.random()*W,y:-20-Math.random()*H*.4,vx:(Math.random()-.5)*1.2,vy:Math.random()*2+1.5,g:.03,r:Math.random()*3+1.2,rot:Math.random()*6,c:pick(cols),life:1.2,decay:.006});
}
function ink(el){
  if (reduce) return; const [x,y]=origin(el);
  for(let i=0;i<22;i++){ const a=Math.random()*6.28, sp=Math.random()*4+1;
    parts.push({type:'drop',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.5,g:.22,r:Math.random()*3+1.5,c:'rgba(46,24,52,.9)',life:1,decay:.02}); }
}
function combo(n){
  if (reduce) return;
  const d=document.createElement('div'); d.className='combo';
  const words={3:'三連続！',5:'五連続！！',7:'七連続！！',10:'十連続！！！'};
  d.innerHTML=`<b>${words[n] || n+'連続！'}</b><span>${n>=10?'LEGENDARY':n>=7?'MASTERFUL':n>=5?'BRILLIANT':'WELL CAST'}</span>`;
  document.body.appendChild(d); setTimeout(()=>d.remove(),1700);
}
function bumpScore(){ const s=$('#score'); s.classList.remove('bump'); void s.offsetWidth; s.classList.add('bump'); }
function celebrate(btn, card, streak){
  const power = streak>=5 ? 2 : 1;
  sparkle(btn, power); ring(btn,'rgba(255,220,130,', power+1); toScore(btn, 10+streak*2);
  flashAt('gold', btn); card.classList.add('glow');
  setTimeout(bumpScore, 650);
  const milestone = streak===3 || streak===5 || streak===7 || (streak>=10 && streak%5===0);
  if (milestone){ combo(streak); if (streak>=5) rain(); }
  sfx.right(streak, milestone);
}
function curse(btn, card){
  card.classList.add('curse'); smoke(btn); ink(btn); ring(btn,'rgba(150,90,170,',1); flashAt('curse');
  sfx.wrong();
}

/* ── sound (WebAudio, starts only after the first click) ── */
let soundOn = true;
try { soundOn = localStorage.getItem('mq-sound') !== 'off'; } catch(e){}
const soundBtn = $('#sound');
function paintSound(){ soundBtn.setAttribute('aria-pressed', soundOn); soundBtn.textContent = soundOn ? '音 ON' : '音 OFF'; }
paintSound();
soundBtn.addEventListener('click', () => { soundOn=!soundOn; paintSound(); try{ localStorage.setItem('mq-sound', soundOn?'on':'off'); }catch(e){} });
let ac=null;
function ctx(){ if(!soundOn) return null; try{ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); }catch(e){ return null; } return ac; }
function tone(a, freq, t0, dur, type='sine', vol=.12){
  const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.setValueAtTime(freq,t0);
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol,t0+.01); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0+dur+.05); return o;
}
const sfx = {
  right(streak, big){
    const a=ctx(); if(!a) return; const t=a.currentTime;
    const base=[1046.5,1318.5,1568,2093]; const lift=Math.min(streak-1,6)*.03;
    base.forEach((f,i)=>tone(a,f*(1+lift),t+i*.07,.5,'sine',.10));
    tone(a,2637*(1+lift),t+.3,.8,'triangle',.05);
    if(big){ [523.25,659.25,783.99,1046.5].forEach(f=>tone(a,f,t+.32,1.2,'triangle',.06)); }
  },
  wrong(){
    const a=ctx(); if(!a) return; const t=a.currentTime;
    const o=tone(a,220,t,.55,'sawtooth',.07); o.frequency.exponentialRampToValueAtTime(70,t+.5);
    tone(a,233,t+.02,.45,'square',.03);
  }
};

/* opening video: fade out before the loop restarts so the cut is soft */
const vid = document.querySelector('.hero video');
if (vid){
  vid.loop = false;
  vid.addEventListener('timeupdate', () => { if (vid.duration && vid.currentTime > vid.duration - 1) vid.classList.add('fade'); });
  vid.addEventListener('ended', () => { vid.currentTime = 0; vid.play().catch(()=>{}); setTimeout(() => vid.classList.remove('fade'), 150); });
  vid.addEventListener('error', () => vid.remove());
}
renderSettings();
})();
